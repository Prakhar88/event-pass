AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Event Ticket Verification & QR Code Validation backend. API Gateway\
  \ -> Lambda -> DynamoDB -> SES.\n"
Parameters:
  SenderEmail:
    Type: String
    Description: SES-verified "from" address used for ticket emails
  AdminRegistrationSecret:
    Type: String
    Default: ''
    Description: Optional secret required for admin registration when not 
      bootstrapped or authenticated
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Allowed origin for CORS
  FrontendBaseUrl:
    Type: String
    Default: http://localhost:5174
    Description: Base URL of the frontend app used in ticket emails (e.g. 
      https://your-frontend-domain.com)
  TelegramBotToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Telegram bot token from @BotFather (leave empty to disable 
      Telegram delivery)
  TelegramBotUsername:
    Type: String
    Default: ''
    Description: Telegram bot username without the @ (used to build t.me deep 
      links)
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        ADMINS_TABLE:
          Ref: AdminsTable
        EVENTS_TABLE:
          Ref: EventsTable
        TICKETS_TABLE:
          Ref: TicketsTable
        VERIFICATION_CODES_TABLE:
          Ref: VerificationCodesTable
        JWT_SECRET_ARN:
          Ref: JwtSecret
        SENDER_EMAIL:
          Ref: SenderEmail
        ADMIN_REGISTRATION_SECRET:
          Ref: AdminRegistrationSecret
        ALLOWED_ORIGIN:
          Ref: AllowedOrigin
        FRONTEND_BASE_URL:
          Ref: FrontendBaseUrl
        TELEGRAM_BOT_TOKEN:
          Ref: TelegramBotToken
        TELEGRAM_BOT_USERNAME:
          Ref: TelegramBotUsername
Resources:
  TicketApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS,PUT,DELETE'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,x-admin-secret'"
        AllowOrigin:
          Fn::Sub: "'${AllowedOrigin}'"
      Auth:
        ApiKeyRequired: false
  AdminsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: adminId
        AttributeType: S
      - AttributeName: email
        AttributeType: S
      KeySchema:
      - AttributeName: adminId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: EmailIndex
        KeySchema:
        - AttributeName: email
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: eventId
        AttributeType: S
      - AttributeName: adminId
        AttributeType: S
      KeySchema:
      - AttributeName: eventId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: AdminIndex
        KeySchema:
        - AttributeName: adminId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: ticketId
        AttributeType: S
      - AttributeName: eventId
        AttributeType: S
      - AttributeName: telegramLinkCode
        AttributeType: S
      KeySchema:
      - AttributeName: ticketId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: EventIndex
        KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        - AttributeName: ticketId
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: TelegramLinkIndex
        KeySchema:
        - AttributeName: telegramLinkCode
          KeyType: HASH
        Projection:
          ProjectionType: KEYS_ONLY
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC secret used to sign/verify ticket JWTs and admin 
        authentication tokens
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  VerificationCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: challengeId
        AttributeType: S
      - AttributeName: ticketId
        AttributeType: S
      KeySchema:
      - AttributeName: challengeId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: TicketIdIndex
        KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  AdminRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/adminRegister.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AdminsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /auth/admin/register
            Method: post
  AdminLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/adminLogin.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: AdminsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /auth/admin/login
            Method: post
  CreateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/createEvent.handler
      Policies:
      - DynamoDBWritePolicy:
          TableName:
            Ref: EventsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /events
            Method: post
        ApiAdmin:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /admin/events
            Method: post
  ListAdminEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/listAdminEvents.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /admin/events
            Method: get
  GetAdminEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/getAdminEvent.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /admin/events/{eventId}
            Method: get
  ListEventTicketsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/listEventTickets.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: TicketsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /admin/events/{eventId}/tickets
            Method: get
  GetEventStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/getEventStats.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: TicketsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /admin/events/{eventId}/stats
            Method: get
  ListPublicEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/listPublicEvents.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /events
            Method: get
        ApiPublic:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /public/events
            Method: get
  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/getEvent.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /events/{eventId}
            Method: get
        ApiPublic:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /public/events/{eventId}
            Method: get
  IssueTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/issueTicket.handler
      Timeout: 15
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TicketsTable
      - Statement:
        - Effect: Allow
          Action: ses:SendRawEmail
          Resource: '*'
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /events/{eventId}/tickets
            Method: post
        ApiPublic:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /public/events/{eventId}/tickets
            Method: post
  GetTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/getTicket.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBReadPolicy:
          TableName:
            Ref: TicketsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /tickets/{ticketId}
            Method: get
        ApiAdmin:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /admin/tickets/{ticketId}
            Method: get
  VerifyTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/verifyTicket.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TicketsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /verify
            Method: post
            Auth:
              ApiKeyRequired: true
  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/telegramWebhook.handler
      Timeout: 15
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TicketsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /telegram/webhook
            Method: post
  ResendTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/resendTicket.handler
      Timeout: 15
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TicketsTable
      - Statement:
        - Effect: Allow
          Action: ses:SendRawEmail
          Resource: '*'
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /tickets/{ticketId}/resend
            Method: post
        ApiAdmin:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /admin/tickets/{ticketId}/resend
            Method: post
  CancelTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/cancelTicket.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TicketsTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /tickets/{ticketId}/cancel
            Method: post
        ApiAdmin:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /admin/tickets/{ticketId}/cancel
            Method: post
  RequestBookingVerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/requestBookingVerification.handler
      Timeout: 15
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: VerificationCodesTable
      - Statement:
        - Effect: Allow
          Action: ses:SendRawEmail
          Resource: '*'
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /public/tickets/request-verification
            Method: post
  VerifyAndBookTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/verifyAndBookTicket.handler
      Timeout: 15
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TicketsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: VerificationCodesTable
      - Statement:
        - Effect: Allow
          Action: ses:SendRawEmail
          Resource: '*'
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /public/tickets/verify-and-book
            Method: post
  RequestCancellationCodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/requestCancellationCode.handler
      Timeout: 15
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: TicketsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: VerificationCodesTable
      - Statement:
        - Effect: Allow
          Action: ses:SendRawEmail
          Resource: '*'
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /public/tickets/{ticketId}/cancel/request-code
            Method: post
  VerifyCancellationCodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: 
        s3://event-ticketing-artifacts-094986466507-ap-south-1/fa93ee262b86d824eb3738d5797dee7d
      Handler: functions/verifyCancellationCode.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EventsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TicketsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: VerificationCodesTable
      - Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource:
            Ref: JwtSecret
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /public/tickets/{ticketId}/cancel/verify-code
            Method: post
  AdminApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: TicketApiProdStage
    Properties:
      Name: event-ticketing-admin-key
      Enabled: true
      StageKeys:
      - RestApiId:
          Ref: TicketApi
        StageName: Prod
  GateApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: TicketApiProdStage
    Properties:
      Name: event-ticketing-gate-key
      Enabled: true
      StageKeys:
      - RestApiId:
          Ref: TicketApi
        StageName: Prod
  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: TicketApiProdStage
    Properties:
      UsagePlanName: event-ticketing-usage-plan
      ApiStages:
      - ApiId:
          Ref: TicketApi
        Stage: Prod
      Throttle:
        RateLimit: 20
        BurstLimit: 40
  AdminUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId:
        Ref: AdminApiKey
      KeyType: API_KEY
      UsagePlanId:
        Ref: ApiUsagePlan
  GateUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId:
        Ref: GateApiKey
      KeyType: API_KEY
      UsagePlanId:
        Ref: ApiUsagePlan
Outputs:
  ApiUrl:
    Description: Base URL for the ticketing API
    Value:
      Fn::Sub: 
        https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  AdminApiKeyId:
    Description: 'Get the actual value: aws apigateway get-api-key --api-key <id>
      --include-value'
    Value:
      Ref: AdminApiKey
  GateApiKeyId:
    Description: 'Get the actual value: aws apigateway get-api-key --api-key <id>
      --include-value'
    Value:
      Ref: GateApiKey
  VerificationCodesTableName:
    Description: DynamoDB table name for OTP verification challenges
    Value:
      Ref: VerificationCodesTable
